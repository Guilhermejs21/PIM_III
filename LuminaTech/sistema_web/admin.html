<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Administração - LuminaTech</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <a class="pular-conteudo" href="#conteudo">Pular para o conteúdo</a>
  <header class="topo" id="topo"></header>
  <main id="conteudo" class="principal">
    <header class="cabecalho-pagina"><h1>Administração de usuários</h1><p class="texto-suave">Cadastre usuários, defina o perfil e ative ou desative acessos.</p></header>
    <section class="grade grade-3" id="resumo" aria-label="Resumo de usuários"></section>
    <section class="cartao" aria-labelledby="t-us"><h2 id="t-us">Usuários</h2>
      <div class="tabela-rolagem"><table class="tabela"><thead><tr><th scope="col">Nome</th><th scope="col">E-mail</th><th scope="col">Perfil</th><th scope="col">Situação</th><th scope="col"><span class="so-leitor">Ação</span></th></tr></thead><tbody id="usuarios"></tbody></table></div></section>
    <section class="cartao" aria-labelledby="t-novo"><h2 id="t-novo">Cadastrar usuário</h2>
      <form id="form-usuario" novalidate>
        <div class="alerta alerta-erro" id="erro" role="alert" hidden></div>
        <div class="campo"><label for="nome">Nome</label><input id="nome" type="text" required></div>
        <div class="campo"><label for="email">E-mail</label><input id="email" type="email" required></div>
        <div class="campo"><label for="senha">Senha (mínimo 6 caracteres)</label><input id="senha" type="password" autocomplete="new-password" required></div>
        <div class="campo"><label for="perfil">Perfil</label><select id="perfil"><option value="aluno">Aluno</option><option value="professor">Professor</option><option value="admin">Administrador</option></select></div>
        <button type="submit" class="btn">Cadastrar usuário</button>
      </form></section>
  </main>
  <footer class="rodape" id="rodape"></footer>
  <script src="js/armazenamento.js"></script>
  <script src="js/comum.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
